<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Max Allee's cybersecurity portfolio featuring security projects, technical labs, and professional development."
    >

    <title>Max Allee | Cybersecurity Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #0b1120;
            color: #e5e7eb;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        main {
            width: 100%;
            max-width: 760px;
            padding: 56px 40px;
            border: 1px solid #273449;
            border-radius: 20px;
            background: #111827;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .label {
            margin: 0 0 12px;
            color: #67e8f9;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.16em;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.8rem, 9vw, 5rem);
            line-height: 1;
        }

        .intro {
            max-width: 620px;
            margin: 24px 0;
            color: #b9c2d0;
            font-size: 1.15rem;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            padding: 12px 18px;
            border: 1px solid #67e8f9;
            border-radius: 10px;
            color: #67e8f9;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover,
        a:focus-visible {
            background: #67e8f9;
            color: #0b1120;
        }

        @media (max-width: 600px) {
            main {
                padding: 40px 24px;
            }
        }
    </style>
</head>

<body>
    <main>
        <p class="label">CYBERSECURITY PORTFOLIO</p>

        <h1>Max Allee</h1>

        <p class="intro">
            Cybersecurity student and former public-safety professional
            building practical experience in security operations, Linux,
            networking, threat hunting, and system administration.
        </p>

        <a
            href="https://github.com/Mallee1"
            target="_blank"
            rel="noopener noreferrer"
        >
            View My GitHub
        </a>
    </main>
</body>
</html>
